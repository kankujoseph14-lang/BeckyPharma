{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">BECKYPHARMA</h3>
            <p class="text-muted small">Connexion à votre espace de travail</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small" role="alert">
                Identifiant ou mot de passe incorrect.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">Identifiant / Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus placeholder="Ex: agent_boutique1">
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label fw-semibold">Clé d'accès / Mot de passe</label>
                <input type="password" name="password" class="form-control" id="id_password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-bold">Se connecter</button>
        </form>
    </div>
</div>
{% endblock %}
